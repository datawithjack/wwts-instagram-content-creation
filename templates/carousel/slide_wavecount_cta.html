{% extends "carousel/base_carousel.html" %}

{% block carousel_head %}
<style>
    /* Tighter cluster — bring headline, body and handle together */
    .cta-container { gap: 24px; }
</style>
{% endblock %}

{% block carousel_content %}
<div class="container cta-container">
    <div class="cta-accent-line"></div>
    <div class="cta-headline">EXPLORE THE FULL STATS</div>
    <div class="cta-subtitle">
        Every wave, every heat, every score from the tour &mdash; at windsurfworldtourstats.com
    </div>
    <div class="cta-accent-line"></div>
    <div class="cta-follow">Follow @windsurfworldtourstats</div>
</div>
{% endblock %}
