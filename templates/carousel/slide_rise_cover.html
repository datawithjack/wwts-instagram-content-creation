{% extends "carousel/base_carousel.html" %}

{% block carousel_head %}
<style>
    .container {
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0;
        gap: 0;
        position: relative;
    }

    /* ── Full-bleed athlete photo ── */
    .photo-bg {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 0;
        background: linear-gradient(160deg, #16243f 0%, #0a0e1a 100%);
    }

    .photo-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center top;
    }

    .photo-bg::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(
            to bottom,
            rgba(14, 25, 39, 0.10) 0%,
            rgba(14, 25, 39, 0.18) 30%,
            rgba(14, 25, 39, 0.50) 46%,
            rgba(14, 25, 39, 0.82) 64%,
            rgba(14, 25, 39, 0.96) 84%,
            rgba(14, 25, 39, 1.00) 100%
        );
        z-index: 1;
    }

    /* ── Content layer — bottom-anchored, left aligned ── */
    .content-layer {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-start;
        text-align: left;
        padding: 0 56px 80px;
    }

    .hero-eyebrow {
        font-family: var(--font-body);
        font-size: 26px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 18px;
    }

    .cover-prefix {
        font-family: var(--font-display);
        font-size: 96px;
        letter-spacing: 0.01em;
        line-height: 0.92;
        color: var(--color-text-primary);
        text-shadow: 0 3px 20px rgba(0,0,0,0.6);
    }

    .cover-name {
        font-family: var(--font-display);
        font-size: 156px;
        letter-spacing: -0.01em;
        line-height: 0.88;
        color: {{ accent_color | default('#9478B5') }};
        margin: 6px 0 14px;
        text-shadow: 0 3px 20px rgba(0,0,0,0.6);
    }

    .cover-location {
        font-family: var(--font-display);
        font-size: 84px;
        letter-spacing: 0.01em;
        line-height: 0.94;
        color: var(--color-text-primary);
        text-shadow: 0 3px 20px rgba(0,0,0,0.6);
    }
</style>
{% endblock %}

{% block carousel_content %}
<div class="container">
    <!-- Full-bleed photo -->
    <div class="photo-bg">
        {% if athlete_photo_url %}<img src="{{ athlete_photo_url }}" alt="{{ cover_name }}">{% endif %}
    </div>

    <!-- Content over photo — bottom-left -->
    <div class="content-layer">
        <div class="hero-eyebrow">{{ eyebrow }}</div>
        <div class="cover-prefix" data-autofit>THE RISE OF</div>
        <div class="cover-name" data-autofit>{{ cover_name }}</div>
        <div class="cover-location" data-autofit>{{ cover_location }}</div>
    </div>
</div>
<script>
document.fonts.ready.then(() => {
    document.querySelectorAll('[data-autofit]').forEach(el => {
        const maxWidth = el.parentElement.offsetWidth - 112; /* account for padding */
        let size = parseInt(getComputedStyle(el).fontSize);
        while (el.scrollWidth > maxWidth && size > 40) {
            size -= 4;
            el.style.fontSize = size + 'px';
        }
    });
});
</script>
{% endblock %}
