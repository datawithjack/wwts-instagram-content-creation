{% extends "base.html" %}

{% block head %}
<style>
    /* Session teal accent (freestyle mode) overrides the default cyan */
    :root {
        --color-accent: {{ accent_color | default('#2dd4bf') }};
    }

    .container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 64px;
    }

    .kicker {
        font-family: var(--font-body);
        font-size: 28px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.45);
        margin-bottom: 20px;
    }

    .eyebrow {
        font-family: var(--font-display);
        font-size: 96px;
        font-weight: 700;
        line-height: 0.95;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--color-accent);
        margin-bottom: 28px;
    }

    .headline {
        font-family: var(--font-display);
        font-size: 200px;
        line-height: 0.9;
        letter-spacing: 0.03em;
        color: var(--color-text-primary);
        margin-bottom: 36px;
    }

    .headline-line {
        display: block;
    }

    .accent-rule {
        width: 96px;
        height: 4px;
        background: var(--color-accent);
        margin: 0 auto 36px;
        border-radius: 2px;
    }

    .sub {
        font-family: var(--font-body);
        font-size: 36px;
        font-weight: 400;
        line-height: 1.4;
        color: var(--color-text-muted);
        max-width: 800px;
        margin-bottom: 72px;
    }

    .sub-line {
        display: block;
    }

    .sub-line + .sub-line {
        margin-top: 16px;
    }

    .sub-strong {
        color: var(--color-text-primary);
        font-weight: 600;
    }

    .cta {
        font-family: var(--font-body);
        font-size: 30px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--color-text-primary);
    }

    .footer {
        position: absolute;
        bottom: 24px;
        right: 32px;
        font-family: var(--font-body);
        font-size: 16px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.20);
        letter-spacing: 0.04em;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="kicker">{{ kicker }}</div>
    <div class="eyebrow">{{ eyebrow }}</div>
    <div class="headline">
        {% for line in headline_lines %}
        <span class="headline-line">{{ line }}</span>
        {% endfor %}
    </div>
    <div class="accent-rule"></div>
    <div class="sub">
        {% for line in sub_lines %}
        <span class="sub-line">{{ line }}</span>
        {% endfor %}
    </div>
    <div class="cta">{{ cta }}</div>
</div>
<div class="footer">{{ url }}</div>
{% endblock %}
